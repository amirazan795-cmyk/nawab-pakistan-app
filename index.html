<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>NAWAB Rawalpindi</title>
    <meta name="description" content="NAWAB Rawalpindi - Ghar Baithe Nawabi. Trusted doorstep home services in Pakistan." />
    <meta property="og:title" content="NAWAB Rawalpindi" />
    <meta property="og:description" content="NAWAB Rawalpindi - Ghar Baithe Nawabi. Trusted doorstep home services in Pakistan." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        -webkit-text-size-adjust: 100% !important;
        text-size-adjust: 100% !important;
      }
      html, body {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100% !important;
      }
      input, textarea, select {
        font-size: 16px !important;
        touch-action: manipulation;
      }
      input::placeholder, textarea::placeholder {
        font-size: 16px !important;
      }
      input::-webkit-input-placeholder, textarea::-webkit-input-placeholder {
        font-size: 16px !important;
      }
      input:focus, textarea:focus, select:focus {
        font-size: 16px !important;
        zoom: 1 !important;
        transform: none !important;
      }
    </style>
    <script>
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturechange', function(e) {
        e.preventDefault();
      }, { passive: false });
      (function() {
        var lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
            var t = e.target;
            if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) {
              t.focus();
            }
          }
          lastTouchEnd = now;
        }, { passive: false });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
